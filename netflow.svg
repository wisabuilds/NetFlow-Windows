<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4" />
      <stop offset="100%" stop-color="#1c71d8" />
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#33d17a" />
      <stop offset="100%" stop-color="#f6d32d" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- GNOME App Icon Base Tile -->
  <rect x="14" y="14" width="100" height="100" rx="24" ry="24" fill="url(#bg)" filter="url(#shadow)" />
  <rect x="14" y="14" width="100" height="100" rx="24" ry="24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Network Switch / Monitor Symbol -->
  <rect x="28" y="32" width="72" height="28" rx="8" fill="#1e1e1e" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
  
  <!-- LED Ports -->
  <circle cx="42" cy="46" r="4" fill="#33d17a" />
  <circle cx="56" cy="46" r="4" fill="#3584e4" />
  <circle cx="70" cy="46" r="4" fill="#f6d32d" />
  <circle cx="84" cy="46" r="4" fill="#33d17a" />

  <!-- Dynamic Wave Pulse Line -->
  <path d="M 30 92 L 48 92 L 56 74 L 66 102 L 76 82 L 84 92 L 98 92" 
        fill="none" 
        stroke="url(#pulse)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
